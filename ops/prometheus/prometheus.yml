global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8000"]
  # Worker replicas are discovered through Docker's DNS: one A record per replica.
  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100
        refresh_interval: 10s

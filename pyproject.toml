[project]
name = "docpilot"
version = "1.0.0"
description = "Multi-tenant document Q&A platform: async Kafka ingestion, pgvector hybrid search, streaming cited answers."
readme = "README.md"
license = "MIT"
authors = [{ name = "Sunag KP" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.17",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "pgvector>=0.3.6",
    "alembic>=1.14",
    "redis>=5.2",
    "aiokafka>=0.12",
    "boto3>=1.35",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "pyjwt>=2.10",
    "httpx>=0.28",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
    "opentelemetry-instrumentation-redis>=0.49b0",
    "opentelemetry-instrumentation-httpx>=0.49b0",
    "openai>=1.55",
    "anthropic>=0.40",
    "fastembed>=0.7",
]

[project.scripts]
docpilot-api = "docpilot.api.main:run"
docpilot-worker = "docpilot.worker:run"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "boto3-stubs[s3]>=1.35",
    "asgi-lifespan>=2.1",
]
load = ["locust>=2.32"]
eval = ["fpdf2>=2.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docpilot"]

[tool.uv]
default-groups = ["dev"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["ui"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF", "ASYNC", "PT", "RET", "PL",
    "TID", "TC", "PERF", "LOG", "G",
]
ignore = [
    "PLR0913", # DI constructors legitimately take many collaborators
    "PLR2004", # magic values are fine in tests/thresholds
    "S101",    # assert is used for type narrowing
    "TC001", "TC002", "TC003", # runtime imports needed by pydantic/FastAPI
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311", "PLR0915", "PLC0415"]
"migrations/**" = ["N999"]
"benchmarks/**" = ["S311"]
"eval/**" = ["S311", "T201"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form", "fastapi.Header", "fastapi.Security"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["docpilot"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aiokafka.*", "docx.*", "pgvector.*", "opentelemetry.instrumentation.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers"
markers = [
    "integration: needs the docker-compose infrastructure (Postgres, Redis, Redpanda, MinIO)",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["docpilot"]
branch = true
omit = ["src/docpilot/api/main.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
]

# ---------------------------------------------------------------- import-linter
[tool.importlinter]
root_package = "docpilot"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture: api -> services -> domain; infra implements ports"
type = "layers"
layers = [
    "docpilot.api",
    "docpilot.services",
    "docpilot.domain",
]

[[tool.importlinter.contracts]]
name = "Domain is pure (no framework or infrastructure imports)"
type = "forbidden"
source_modules = ["docpilot.domain"]
forbidden_modules = ["docpilot.infra", "docpilot.api", "fastapi", "sqlalchemy", "redis", "aiokafka", "boto3"]

[[tool.importlinter.contracts]]
name = "Services depend on ports, never on concrete infrastructure"
type = "forbidden"
source_modules = ["docpilot.services"]
forbidden_modules = ["docpilot.infra", "docpilot.api", "fastapi", "sqlalchemy", "redis", "aiokafka", "boto3"]

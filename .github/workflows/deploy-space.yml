name: Deploy (Hugging Face Space)

# Builds the single-container image (deploy/huggingface), boots it the way a Space runs it
# and runs the end-to-end smoke test. The upload to a Hugging Face Space is opt-in: Docker
# Spaces need a Hugging Face PRO plan since mid-2026, so it runs only when the HF_SPACE
# repository variable (<user>/<space>) and the HF_TOKEN secret are both set.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "deploy/**"
      - "src/**"
      - "ui/**"
      - "migrations/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy-space.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-space-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.32"
  HF_SPACE: ${{ vars.HF_SPACE }}

jobs:
  deploy:
    name: Build, smoke-test and deploy the Space
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - name: Assemble the Space
        run: deploy/huggingface/assemble.sh "$RUNNER_TEMP/space"
      - name: Build the image
        run: docker build -t docpilot-space "$RUNNER_TEMP/space"
      - name: Boot it as the Space does and run the smoke test
        run: |
          docker run -d --name space --user 1000 -p 7860:7860 docpilot-space
          for i in $(seq 1 90); do curl -fsS localhost:7860/readyz && break; sleep 2; done
          uv run --no-project --with httpx python scripts/smoke_test.py --base-url http://localhost:7860
      - name: Container logs
        if: failure()
        run: docker logs space
      - name: Upload to the Space
        if: >-
          github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
          && env.HF_SPACE != '' && env.HF_TOKEN != ''
        run: |
          uv run --no-project --with huggingface_hub==1.33.0 \
            python deploy/huggingface/upload.py "$RUNNER_TEMP/space"

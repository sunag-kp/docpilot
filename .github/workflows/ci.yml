name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.32"
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --python ${{ env.PYTHON_VERSION }}
      - name: Ruff lint
        run: uv run ruff check --output-format=github .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy
      - name: Architecture contracts (import-linter)
        run: uv run lint-imports

  test:
    name: Tests (unit + integration)
    runs-on: ubuntu-latest
    # GitHub service containers: Postgres+pgvector, Redis and Redpanda run with their image
    # defaults. MinIO needs a `server` argument, which service containers can't pass, so it
    # is started with one `docker run` step below.
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-trixie
        env:
          POSTGRES_USER: docpilot
          POSTGRES_PASSWORD: docpilot
          POSTGRES_DB: docpilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U docpilot -d docpilot"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redpanda:
        image: redpandadata/redpanda:v26.2.5
        ports: ["9092:9092"]
        options: >-
          --health-cmd "rpk cluster health | grep -E 'Healthy:.+true'"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://docpilot:docpilot@localhost:5432/docpilot
      REDIS_URL: redis://localhost:6379/0
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      S3_ENDPOINT_URL: http://localhost:9000
      EMBEDDING_CACHE_DIR: ${{ github.workspace }}/.models
    steps:
      - uses: actions/checkout@v4
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z server /data
          for i in $(seq 1 30); do curl -fsS http://localhost:9000/minio/health/ready && exit 0; sleep 1; done
          docker logs minio; exit 1
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --python ${{ env.PYTHON_VERSION }}
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .models
          key: models-${{ hashFiles('src/docpilot/infra/embeddings/model_download.py') }}
      - name: Apply migrations
        run: uv run alembic upgrade head
      - name: Pytest with coverage
        run: uv run pytest --cov --cov-report=term-missing:skip-covered --cov-report=xml --cov-fail-under=80
      - name: Coverage summary
        if: always()
        run: |
          uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  ui:
    name: UI (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:demo

  docker:
    name: Docker build & compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the full stack
        run: docker compose up --build -d --wait --wait-timeout 300
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - name: End-to-end smoke test (signup -> upload -> Kafka -> worker -> ready)
        run: uv run --no-project --with httpx python scripts/smoke_test.py
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v

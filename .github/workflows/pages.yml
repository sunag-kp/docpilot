name: Pages (browser demo)

# Publishes the UI in demo mode (the whole backend is mocked in the browser, so the live
# demo costs nothing to host) and the API reference at /api/.
# One-time setup: Settings -> Pages -> Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - "eval/corpus_src/**"
      - "docs/openapi.json"
      - "docs/api.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: ui
      - run: npm run build:demo
        working-directory: ui
      - name: Add the API reference (Redoc over the committed OpenAPI schema)
        run: |
          mkdir -p ui/dist/api
          cp docs/openapi.json ui/dist/api/openapi.json
          cp docs/api.html ui/dist/api/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ui/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
